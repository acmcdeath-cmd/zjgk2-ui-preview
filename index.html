function subjectPage(){return head("SUBJECT LIBRARY","科目题库","选择科目，沿着知识结构查找题目。")+'<div class="subjects">'+subjects.map(subjectCard).join("")+'</div><div class="modulegrid"><section class="module glass"><span class="tag">知识点驱动</span><h4>先定位知识，再查看题目</h4><p>从科目、章节、知识点逐层进入，避免在大量题目中盲目翻找。</p></section><section class="module glass"><span class="tag">来源可追溯</span><h4>题目与原始试卷相互关联</h4><p>展示年份、题源性质、原始题号与原卷位置。</p></section></div>'}
function knowledge(){return head("KNOWLEDGE MAP","知识点目录","以考纲知识要求为边界，按可学习、可检索的结构组织题目。当前内容仅用于 UI 演示。")+'<div class="knowledge"><aside class="tree glass"><h4>数学 · 知识模块</h4><button class="active">集合与逻辑 <span>8</span></button><button>函数 <span>21</span></button><button>几何与代数 <span>29</span></button><button>概率与统计 <span>12</span></button><button>其他基础 <span>12</span></button></aside><section class="points glass"><div class="eyebrow">MATH / UNIT 01</div><h3>集合与逻辑初步</h3><p class="desc">从集合的基本概念、表示方法到集合间关系与运算。选择一个知识点，进入关联题目。</p>'+[
["集合的概念与表示","元素、集合、列举法、描述法","12"],
["元素与集合的关系","属于、不属于及符号表达","8"],
["子集与集合相等","包含关系、子集个数、双向包含","15"],
["集合的交、并、补运算","韦恩图、运算关系与性质","11"]
].map((p,i)=>'<div class="point"><div class="num">0'+(i+1)+'</div><div><strong>'+p[0]+'</strong><small>'+p[1]+'</small></div><small style="margin-left:auto;color:#91a0b4">关联题 '+p[2]+' 道</small><button data-page="questions">→</button></div>').join("")+'</section></div>'}
function questionList(){let arr=questions.filter(q=>filter==="全部题目"||q.source===filter);return head("QUESTION BANK","题目列表","题目来源、原始题号和知识点关系一并展示；演示题目不代表真实题库已经导入。")+'<div class="filters">'+["全部题目","省级真题","模拟题"].map(x=>'<button class="'+(filter===x?"active":"")+'" data-filter="'+x+'">'+x+'</button>').join("")+'</div>'+arr.map(q=>'<div class="qrow glass" data-page="objective"><div class="qtype">'+(q.type==="客观题"?"选":"解")+'</div><div style="min-width:0"><strong>'+q.title+'</strong><p>'+q.meta+'</p><div class="qmeta"><span>'+q.source+'</span><span>'+q.year+'</span><span>'+q.id+'</span></div></div><button class="arrow" data-page="objective">→</button></div>').join("")}
function objective(){return head("QUESTION DETAIL","客观题练习","数学 · 集合与逻辑初步 · 选择题")+'<section class="question glass"><div class="qinfo"><span class="tag">来源示例 · 省级真题</span><span>单项选择</span><span>4 分</span><span>演示题面</span></div><p class="stem">已知集合 A = {1, 2, 3, 4}，B = {2, 4, 6}，则 A ∩ B =（　）。</p><div class="math">A ∩ B = { x | x ∈ A 且 x ∈ B }</div><div class="options">'+[["A","{1, 3}"],["B","{2, 4}"],["C","{2, 4, 6}"],["D","{1, 2, 3, 4, 6}"]].map(x=>'<button class="option '+(choice===x[0]?"selected":"")+'" data-choice="'+x[0]+'"><span class="letter">'+x[0]+'</span>'+x[1]+'</button>').join("")+'</div><div class="feedback" id="feedback">回答正确。交集表示两个集合中共同拥有的元素，因此结果为 {2, 4}。这是演示反馈，不连接正式成绩记录。</div><div class="actions"><small>答题状态仅保存在当前演示页面</small><button class="btn primary" id="submit">提交答案 →</button></div></section><div class="modulegrid"><section class="module glass"><span class="tag">知识关联</span><h4>集合的交集</h4><p>识别同时属于两个集合的元素，并用列举法写出结果。</p></section><section class="module glass"><span class="tag">来源追溯</span><h4>原卷位置（演示）</h4><p>年份、原始题号、原卷页码将在真实数据导入后关联。</p></section></div>'}
function subjective(){return head("WRITTEN RESPONSE","主观题作答","纸笔完成计算或推理后，拍照上传作答过程。首期不依赖 AI 识别或自动评分。")+'<section class="question glass" style="max-width:none"><div class="qinfo"><span>数学</span><span>解答题</span><span>演示题面</span></div><p class="stem">已知函数 f(x) = x² − 4x + 3。<br>（1）求函数图像的对称轴与顶点坐标；<br>（2）求函数在区间 [0, 3] 上的最小值。</p><p class="desc">建议纸笔完成，保留必要推导步骤。</p></section><div class="written"><section class="glass"><h4>纸笔作答区域</h4><p class="desc">在纸上完成后，可上传一张或多张图片。题目与作答记录会关联保存。</p><div class="paper">纸笔作答提示区 · 非真实答题纸</div></section><section class="glass"><h4>上传作答图片</h4><p class="desc">支持 JPG、PNG 等常见图片格式。此原型仅演示本地选择，不上传服务器。</p><label class="uploadzone" for="files"><strong>＋　点击选择图片</strong><p>可多选 · 本地预览 · 不会上传</p><input id="files" type="file" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div><button class="btn primary" style="width:100%;margin-top:12px" data-toast="演示完成：未向任何服务器上传文件">保存作答（演示）</button></section></div>'}
const labels={home:"学习总览",subject:"科目题库",knowledge:"知识点目录",questions:"题目列表",objective:"客观题详情",subjective:"主观题作答"};
function render(p){page=p;let map={home,subject:subjectPage,knowledge,questions:questionList,objective,subjective};content.innerHTML=map[p]();crumb.innerHTML="WORKSPACE　/　<b>"+labels[p]+"</b>";document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));}
function toast(s){const el=document.getElementById("toast");el.textContent=s;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-theme]");if(t){document.body.dataset.theme=t.dataset.theme;document.querySelectorAll("[data-theme]").forEach(b=>b.classList.toggle("active",b===t));toast(t.dataset.theme==="lite"?"已切换 Lite 性能优先主题":"已切换 Glass 高质感主题");return}const d=e.target.closest("[data-device]");if(d){document.body.classList.toggle("mobile-preview",d.dataset.device==="mobile");document.querySelectorAll("[data-device]").forEach(b=>b.classList.toggle("active",b===d));toast(d.dataset.device==="mobile"?"已切换手机端布局":"已切换桌面端布局");return}const f=e.target.closest("[data-filter]");if(f){filter=f.dataset.filter;render("questions");return}const c=e.target.closest("[data-choice]");if(c){choice=c.dataset.choice;document.querySelectorAll("[data-choice]").forEach(b=>b.classList.toggle("selected",b===c));return}const p=e.target.closest("[data-page]");if(p){render(p.dataset.page);return}const msg=e.target.closest("[data-toast]");if(msg)toast(msg.dataset.toast);if(e.target.id==="submit"){if(!choice){toast("请先选择一个选项");return}document.getElementById("feedback").classList.add("show");toast(choice==="B"?"回答正确":"已提交，正确答案为 B（演示）")}});
document.addEventListener("change",e=>{if(e.target.id==="files"){const box=document.getElementById("thumbs");box.innerHTML="";[...e.target.files].forEach(file=>{const img=document.createElement("img");img.src=URL.createObjectURL(file);img.alt=file.name;box.appendChild(img)})}});
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter"){render("questions");toast("已进入题目列表，可查看演示题目")}});render("home");
</script>
</body></html>
